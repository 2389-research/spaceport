# ABOUTME: Defines the native Spaceport app and its simulator tests.
# ABOUTME: Links the embedded Rust client for the selected Apple platform.
name: SpaceportMobile
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Ghostty:
    url: https://github.com/Lakr233/libghostty-spm.git
    exactVersion: 2.2.2026111701
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "18"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
  configs:
    Debug:
      SPACEPORT_WIDGET_GROUP: group.ai.2389.spaceport.mobile.development.widget
    Release:
      SPACEPORT_WIDGET_GROUP: group.ai.2389.spaceport.mobile.widget
targets:
  SpaceportMobile:
    type: application
    platform: iOS
    sources:
      - FileSharing
      - Sources
      - Shared
      - Assets.xcassets
      - Generated/AgentMarks.xcassets
      - path: ../../landing/public/assets/rocket-560.webp
        buildPhase: resources
      - path: ../../NOTICE
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: Notices
        type: folder
        buildPhase: resources
      - Generated/spaceport_mobile.swift
    dependencies:
      - target: ShareFile
        embed: true
      - target: AgentStatusWidget
        embed: true
      - framework: ../.build/SpaceportMobileCore.xcframework
        embed: false
      - sdk: Security.framework
      - package: Ghostty
        product: GhosttyTerminal
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: WidgetGroup.entitlements
        INFOPLIST_FILE: ReleaseInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Spaceport
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the SSH hosts you select on your local network.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.development
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(SPACEPORT_MOBILE_PROFILE)"
          PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile
  ShareFile:
    type: app-extension
    platform: iOS
    sources:
      - FileSharing
      - path: ShareExtension
        excludes: [Info.plist]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: WidgetGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Send to Spaceport
        INFOPLIST_FILE: ShareExtension/Info.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.development.share
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(SPACEPORT_SHARE_PROFILE)"
          PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.share
  AgentStatusWidget:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - path: LiveActivity
        excludes: [Info.plist]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: WidgetGroup.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaceport Agents
        INFOPLIST_FILE: LiveActivity/Info.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.development.agent-status
        Release:
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(SPACEPORT_ACTIVITY_PROFILE)"
          PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.agent-status
  SpaceportMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.tests
    dependencies:
      - target: SpaceportMobile
  SpaceportMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.2389.spaceport.mobile.uitests
    dependencies:
      - target: SpaceportMobile
schemes:
  SpaceportMobile:
    build:
      targets:
        SpaceportMobile: all
    test:
      targets: [SpaceportMobileTests, SpaceportMobileUITests]
