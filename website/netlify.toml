# Inherited sheprd.org site: base directory `website`. Keep Git-triggered
# builds paused in the Spaceport fork until a separate site owner is verified.
[build]
command = ""
publish = "site"
# Netlify treats exit 0 as "ignore this build", matching the root site gate.
ignore = "exit 0"

# Scope the canonical redirect to www so deploy previews remain usable.
[[redirects]]
force  = true
from   = "https://www.sheprd.org/*"
status = 301
to     = "https://sheprd.org/:splat"

[[redirects]]
force  = true
from   = "http://www.sheprd.org/*"
status = 301
to     = "https://sheprd.org/:splat"
