# Signs and uploads the Spaceport Mobile app to TestFlight on a v* release tag.
# It runs after the macOS preview route publishes that tag's release, and never
# changes the macOS or Android routes.
name: iOS TestFlight
run-name: iOS TestFlight ${{ github.event.workflow_run.head_branch || inputs.version }}

on:
  # zizmor: ignore[dangerous-triggers] only completed tag-push runs of this repository's own
  # macOS preview workflow proceed, and that run's publish job has created the tag's release.
  # A pull request or a fork never reaches it, and no secret is read before the signing job.
  workflow_run:
    workflows: ['macOS signed preview']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Calendar version this build uploads as (YYYYMMDD.COUNTER, no v prefix)
        required: true
        type: string
      tag:
        description: Release tag to attach the .ipa to, vYYYYMMDD.COUNTER; empty keeps it a workflow artifact
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-testflight-${{ github.event.workflow_run.head_branch || inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      github.repository == '2389-research/spaceport' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.repository.full_name == '2389-research/spaceport' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      sha: ${{ steps.request.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read release validation code from the workflow commit on main.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version and record the commit
        id: request
        env:
          INPUT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source scripts/release/common.sh
          # A tag push names the version; a manual run must state it.
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            tag="$INPUT_BRANCH"
            version="${tag#v}"
          else
            tag="$INPUT_TAG"
            version="$INPUT_VERSION"
          fi
          version_check "$version"
          [[ -z "$tag" || "$tag" == "v$version" ]] || fail "The release tag must be v$version, not $tag"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            [[ $(git rev-parse --verify "refs/tags/$tag^{commit}") == "$INPUT_SHA" ]] ||
              fail 'The release tag must name the triggering commit'
            git merge-base --is-ancestor "$INPUT_SHA" refs/remotes/origin/main ||
              fail 'The release commit must belong to main'
            git checkout --detach "$INPUT_SHA"
          fi
          sha=$(git rev-parse 'HEAD^{commit}')
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'sha=%s\n' "$sha"
          } >> "$GITHUB_OUTPUT"
      - name: Build the optimized Rust libraries and the Xcode project
        run: ./mobile/build-apple --release
      # SKIPPED GATE: this route builds but does not run an iOS simulator suite.
      # mobile/README.md's verification target is Product -> Test inside Xcode: its
      # live tests need a disposable SSH host, a hand-driven Duo fold and seeded
      # Herdr sessions, and `just test-ios-duo` needs an open simulator on a desktop.
      # Neither is a CI-runnable suite, so nothing here pretends to run one.
      # TODO(ios-simulator-gate): add a hermetic subset of mobile/apple/Tests that
      # needs no SSH fixture, run it here with `xcodebuild test -only-testing:...`
      # on a simulator destination, and require it before signing once it fits the
      # macOS runner budget. Record the result in the job summary.
      - name: Package the built project for the signing job
        run: |
          set -euo pipefail
          mkdir -p target/ios-input
          tar -czf target/ios-input/SpaceportMobile.tar.gz -C mobile \
            .build/SpaceportMobileCore.xcframework apple/Generated apple/SpaceportMobile.xcodeproj
          (cd target/ios-input && shasum -a 256 SpaceportMobile.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-input-${{ github.run_id }}
          path: target/ios-input/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: >-
      github.repository == '2389-research/spaceport' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.repository.full_name == '2389-research/spaceport' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    environment: ios-testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-input-${{ github.run_id }}
          path: target/ios-input
      - name: Unpack only this run's build inputs
        run: |
          set -euo pipefail
          cd target/ios-input
          shasum -a 256 -c SHA256SUMS
          tar -xzf SpaceportMobile.tar.gz -C "$GITHUB_WORKSPACE/mobile"
          mkdir -p "$GITHUB_WORKSPACE/target/ios-release"
      # Only this job receives the distribution identity, the provisioning profiles and
      # the App Store Connect key.
      - name: Sign, verify and upload this build to TestFlight
        env:
          SPACEPORT_APPLE_TEAM_ID: ${{ vars.SPACEPORT_APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPACEPORT_MOBILE_PROFILE_B64: ${{ secrets.SPACEPORT_MOBILE_PROFILE_B64 }}
          SPACEPORT_ACTIVITY_PROFILE_B64: ${{ secrets.SPACEPORT_ACTIVITY_PROFILE_B64 }}
          SPACEPORT_SHARE_PROFILE_B64: ${{ secrets.SPACEPORT_SHARE_PROFILE_B64 }}
        run: bash scripts/release/sign-ios.sh "$VERSION" target/ios-release
      - name: Record the TestFlight upload in the job summary
        if: always()
        run: |
          set -euo pipefail
          receipt="target/ios-release/Spaceport-$VERSION-ios.ipa.json"
          {
            printf '### iOS TestFlight %s\n\n' "$VERSION"
            if [[ -f "$receipt" ]]; then
              printf '| Fact | Value |\n| --- | --- |\n'
              jq -r '"| bundle id | \(.bundle_id) |\n| build number | \(.build_number) |\n| marketing version | \(.marketing_version) |\n| team id | \(.team_id) |\n| sha256 | \(.sha256) |\n| TestFlight | \(.testflight): \(.message) |"' "$receipt"
            else
              printf 'No receipt: the build was not signed or the upload did not finish.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the .ipa, its checksum and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-testflight-${{ github.run_id }}
          path: target/ios-release
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [build, sign]
    if: >-
      github.repository == '2389-research/spaceport' &&
      needs.build.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SHA: ${{ needs.build.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-testflight-${{ github.run_id }}
          path: target/ios-release
      - name: Refuse a tag that moved during the build
        run: scripts/release/check-tag-unmoved.sh "$GITHUB_REPOSITORY" "$TAG" "$SHA"
      - name: Record the TestFlight upload in the job summary
        run: |
          set -euo pipefail
          cd target/ios-release
          sha256sum -c "Spaceport-$VERSION-ios.ipa.sha256"
          jq -e '.testflight == "accepted"' "Spaceport-$VERSION-ios.ipa.json" > /dev/null
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            printf '### iOS TestFlight %s\n\nThe .ipa and its checksum are attached to the %s release.\n' \
              "$VERSION" "$TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$GITHUB_EVENT_NAME" != workflow_run ]] || {
              printf '::error::The macOS preview route published no release for %s\n' "$TAG" >&2
              exit 1
            }
            printf '### iOS TestFlight %s\n\nNo release for %s; the .ipa stays a workflow artifact.\n' \
              "$VERSION" "$TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The upload happened in the signing job; this job publishes nothing else.
      - name: Attach the .ipa and its checksum to the tag's release
        run: |
          set -euo pipefail
          cd target/ios-release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "Spaceport-$VERSION-ios.ipa" "Spaceport-$VERSION-ios.ipa.sha256" \
              --repo "$GITHUB_REPOSITORY"
          fi
