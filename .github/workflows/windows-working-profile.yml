# ABOUTME: Checks native sampling prerequisites on a disposable Windows profile branch.
# ABOUTME: Separates read-only inventory from isolated desktop-preparation contracts.
name: Windows working profile probe

on:
  push:
    branches: [fix/review-squad-windows-profile, fix/review-squad-windows-profile-animation]

permissions: {}

concurrency:
  group: windows-working-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile'
    runs-on: windows-2025
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect installed sampling tools and built-in profiles
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = @(foreach ($name in @('wpr.exe', 'xperf.exe', 'WPAExporter.exe', 'tracerpt.exe', 'gpg.exe')) {
            $command = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            [ordered]@{
              name = $name
              available_on_path = $null -ne $command
              path = if ($null -ne $command) { $command.Source } else { $null }
              version = if ($null -ne $command) { $command.FileVersionInfo.FileVersion } else { $null }
            }
          })
          [ordered]@{
            stage = 'sampling_tool_inventory'
            os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            tools = $tools
            limit = 'No GUI, trace, or performance measurement ran.'
          } | ConvertTo-Json -Depth 4 -Compress | Write-Output
          $wpr = Get-Command wpr.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wpr) { throw 'Windows Performance Recorder is not available on PATH.' }
          & $wpr.Source -profiles
          if ($LASTEXITCODE -ne 0) { throw "WPR profile inventory failed with exit $LASTEXITCODE" }
      - name: Inspect the disposable desktop animation preference
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $null = [Windows.UI.ViewManagement.UISettings,Windows.UI.ViewManagement,ContentType=WindowsRuntime]
          $settings = [Windows.UI.ViewManagement.UISettings]::new()
          [ordered]@{
            animations_enabled = [bool]$settings.AnimationsEnabled
            scope = 'Read-only OS preference; the native app must independently report its cached policy.'
          } | ConvertTo-Json -Compress | Write-Output
      - name: Inspect stack extraction flags
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -help stack
      - name: Inspect trace event statistics flags
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -help tracestats
      - name: Inspect sampled profile export flags
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -help profile
      - name: Inspect local symbol resolution flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -help symbols
      - name: Inspect recording start flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help start
      - name: Inspect installed CPU recording definitions without recording
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & wpr.exe -help profiles
          if ($LASTEXITCODE -ne 0) { throw 'WPR profile help failed.' }
          & wpr.exe -profiledetails CPU -filemode
          if ($LASTEXITCODE -ne 0) { throw 'Installed CPU file profile inspection failed.' }
          & wpr.exe -profiledetails CPU.light -filemode
          if ($LASTEXITCODE -ne 0) { throw 'Installed light CPU file profile inspection failed.' }
          $definition = Join-Path $env:RUNNER_TEMP 'spaceport-installed-cpu.wprp'
          & wpr.exe -exportprofile CPU $definition -filemode
          if ($LASTEXITCODE -ne 0) { throw 'Installed CPU file profile export failed.' }
          Get-Content -LiteralPath $definition
      - name: Inspect recording status flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help status
      - name: Validate sampled CPU profile without recording
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:GITHUB_WORKSPACE 'scripts/profile/spaceport-cpu.wprp'
          $toolkit = Split-Path (Get-Command xperf.exe -CommandType Application -ErrorAction Stop).Source
          $schema = Get-ChildItem -LiteralPath $toolkit -Filter WPRControlProfiles.xsd -File -Recurse | Select-Object -First 1
          if ($null -ne $schema) {
            $settings = [System.Xml.XmlReaderSettings]::new()
            $settings.ValidationType = [System.Xml.ValidationType]::Schema
            $settings.Schemas.Add($null, $schema.FullName) | Out-Null
            $xml = [System.Xml.XmlReader]::Create($profile, $settings)
            try { while ($xml.Read()) {} } finally { $xml.Dispose() }
            "Installed WPR schema validated: $($schema.FullName)" | Write-Output
          } else {
            'Installed WPR schema unavailable; validating through the native parser.' | Write-Output
          }
          Get-FileHash -LiteralPath $profile -Algorithm SHA256
          & wpr.exe -profiles $profile
          if ($LASTEXITCODE -ne 0) { throw 'Native sampled CPU profile listing failed.' }
          & wpr.exe -profiledetails "$profile!SpaceportCpu" -filemode
          if ($LASTEXITCODE -ne 0) { throw 'Native sampled CPU file profile validation failed.' }
          & wpr.exe -profiledetails "$profile!SpaceportCpu"
          if ($LASTEXITCODE -ne 0) { throw 'Native sampled CPU memory profile validation failed.' }
      - name: Inspect recording stop flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help stop
      - name: Inspect named recording scope
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help advanced
      - name: Inspect current recording state
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -status
      - name: Inspect detailed recording collectors
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -status collectors -details
      - name: Inspect all active trace sessions
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -loggers
  animations:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile-animation'
    runs-on: windows-2025
    timeout-minutes: 3
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the private animation evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'spaceport-animation-check'
          if (Test-Path -LiteralPath $directory) { throw 'Refusing an existing animation evidence directory.' }
          [IO.Directory]::CreateDirectory($directory) | Out-Null
      - name: Enable animations through the profile preparation helper
        run: ./scripts/profile/desktop-animations.ps1 -Action Enable -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'spaceport-animation-check')
      - name: Require animations in a fresh Windows PowerShell process
        run: |
          $ErrorActionPreference = 'Stop'
          $null = [Windows.UI.ViewManagement.UISettings,Windows.UI.ViewManagement,ContentType=WindowsRuntime]
          $settings = [Windows.UI.ViewManagement.UISettings]::new()
          $enabled = [bool]$settings.AnimationsEnabled
          [ordered]@{animations_enabled = $enabled; scope = 'Fresh process after desktop preparation.'} | ConvertTo-Json -Compress | Write-Output
          if (-not $enabled) { throw 'AnimationsEnabled is false after desktop preparation.' }
      - name: Refuse repeated preparation without replacing restoration authority
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'spaceport-animation-check'
          $saved = Join-Path $directory 'desktop-animation-original.json'
          $before = (Get-FileHash -LiteralPath $saved -Algorithm SHA256).Hash
          $refused = $false
          try { ./scripts/profile/desktop-animations.ps1 -Action Enable -EvidenceDirectory $directory }
          catch { $refused = $true }
          if (-not $refused) { throw 'Repeated preparation must refuse the existing original-preference record.' }
          if ((Get-FileHash -LiteralPath $saved -Algorithm SHA256).Hash -ne $before) {
            throw 'Repeated preparation changed restoration authority.'
          }
      - name: Restore and verify the original desktop animation preference
        if: ${{ always() }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'spaceport-animation-check'
          if (Test-Path -LiteralPath (Join-Path $directory 'desktop-animation-original.json')) {
            ./scripts/profile/desktop-animations.ps1 -Action Restore -EvidenceDirectory $directory
          }
      - name: Verify restoration from a fresh Windows PowerShell process
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          $saved = Join-Path (Join-Path $env:RUNNER_TEMP 'spaceport-animation-check') 'desktop-animation-original.json'
          if (Test-Path -LiteralPath $saved) {
            $original = Get-Content -LiteralPath $saved -Raw | ConvertFrom-Json
            $null = [Windows.UI.ViewManagement.UISettings,Windows.UI.ViewManagement,ContentType=WindowsRuntime]
            $settings = [Windows.UI.ViewManagement.UISettings]::new()
            $actual = [bool]$settings.AnimationsEnabled
            [ordered]@{animations_enabled = $actual; expected = $original.animations_enabled; scope = 'Fresh process after restoration.'} |
              ConvertTo-Json -Compress | Write-Output
            if ($actual -ne $original.animations_enabled) { throw 'Fresh-process animation restoration differs from the saved preference.' }
          }

  retention:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile'
    runs-on: windows-2025
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Encrypt a generated retention probe
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probeRoot = Join-Path $env:RUNNER_TEMP 'spaceport-retention-probe'
          if (Test-Path $probeRoot) { throw 'Refusing an existing retention probe directory.' }
          $source = Join-Path $probeRoot 'source'
          [IO.Directory]::CreateDirectory($source) | Out-Null
          [IO.File]::WriteAllText((Join-Path $source 'marker.txt'), "SPACEPORT_RETENTION_PROBE_v1`n", [Text.UTF8Encoding]::new($false))
          $recipient = Join-Path $env:GITHUB_WORKSPACE 'docs/evidence/review-squad/windows-profile/retention-public.asc'
          $sealed = Join-Path $env:RUNNER_TEMP 'spaceport-retention-probe.zip.gpg'
          & ./scripts/profile/encrypt-artifacts.ps1 -SourceDirectory $source -RecipientFile $recipient -OutputFile $sealed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spaceport-encrypted-retention-probe
          path: ${{ runner.temp }}/spaceport-retention-probe.zip.gpg
          if-no-files-found: error
          retention-days: 7
  protocol:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        shell: bash
        run: rustup show
      - name: Check protocol compatibility and owned patch cells
        shell: bash
        run: cargo test --locked -p sheprd-protocol
      - name: Check client surface delivery and encoding
        shell: bash
        run: cargo test --locked -p sheprd-client --lib surface -- --nocapture
      - name: Check opt-in client copy counter contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p sheprd-client --features integration-test --lib surface_patch_stats
      - name: Lint protocol and client targets
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo clippy --locked -p sheprd-protocol -p sheprd-client --all-targets --all-features -- -D warnings
  contracts:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        shell: bash
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: working-profile-${{ matrix.runner }}
          save-if: false
      - name: Select the installed Windows trace reader
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reader = Get-Command xperf.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "SPACEPORT_WORKING_PROFILE_XPERF=$($reader.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise ordinary profile contracts without a GUI or daemon
        shell: bash
        run: cargo test --locked -p sheprd-gpui --features integration-test --test working_profile -- --nocapture
      - name: Exercise projected Core observer contracts headlessly
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport core_terminals::view::profile::tests -- --nocapture
      - name: Exercise mark-layer counter and timer budget headlessly
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport mark_layer::profile_tests -- --nocapture
      - name: Exercise Core paint, input, and geometry contracts headlessly
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport core_terminals::view::tests -- --nocapture
      - name: Exercise picture painting, parked placement, and group ownership headlessly
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport group_terminals:: -- --nocapture
      - name: Exercise ordinary Windows Core fixture contracts
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows -- --nocapture
          cargo clippy --locked -p sheprd-gpui --features integration-test --test accessibility_windows -- -D warnings
      - name: Classify actual Windows recorder state without recording
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        run: cargo test --locked -p sheprd-gpui --features integration-test --test working_profile working_profile::harness::windows::tests::read_only_windows_recorder_inventory -- --ignored --exact --nocapture
      - name: Lint the profile harness and app wiring
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo clippy --locked -p sheprd-gpui --features integration-test --bin spaceport --test working_profile -- -D warnings
