# ABOUTME: Checks native sampling prerequisites on a disposable Windows profile branch.
# ABOUTME: Lists tools and profiles without recording, installing, or changing system state.
name: Windows working profile probe

on:
  push:
    branches: [fix/review-squad-windows-profile]

permissions: {}

concurrency:
  group: windows-working-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile'
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Inspect installed sampling tools and built-in profiles
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = @(foreach ($name in @('wpr.exe', 'xperf.exe', 'WPAExporter.exe', 'tracerpt.exe')) {
            $command = Get-Command $name -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            [ordered]@{
              name = $name
              available_on_path = $null -ne $command
              path = if ($null -ne $command) { $command.Source } else { $null }
              version = if ($null -ne $command) { $command.FileVersionInfo.FileVersion } else { $null }
            }
          })
          [ordered]@{
            stage = 'sampling_tool_inventory'
            os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            tools = $tools
            limit = 'No GUI, trace, or performance measurement ran.'
          } | ConvertTo-Json -Depth 4 -Compress | Write-Output
          $wpr = Get-Command wpr.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $wpr) { throw 'Windows Performance Recorder is not available on PATH.' }
          & $wpr.Source -profiles
          if ($LASTEXITCODE -ne 0) { throw "WPR profile inventory failed with exit $LASTEXITCODE" }
      - name: Inspect stack extraction flags
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -help stack
      - name: Inspect local symbol resolution flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: xperf.exe -help symbols
      - name: Inspect recording start flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help start
      - name: Inspect recording status flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help status
      - name: Inspect recording stop flags
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -help stop
      - name: Inspect current recording state
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -status
      - name: Inspect detailed recording collectors
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: powershell
        run: wpr.exe -status collectors -details
  contracts:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile'
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        shell: bash
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: working-profile-windows-2025
          save-if: false
      - name: Exercise ordinary profile contracts without a GUI or daemon
        shell: bash
        run: cargo test --locked -p sheprd-gpui --features integration-test --test working_profile -- --nocapture
