# ABOUTME: Qualifies the remaining keyboard cases on one disposable Windows branch.
# ABOUTME: Keeps the pinned daemon, native layouts, and helpers inside isolated fixtures.
name: Windows shortcut qualification probe

on:
  push:
    branches: [fix/review-squad-windows-native]

permissions: {}

concurrency:
  group: windows-shortcut-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  replay:
    name: Core stream replay
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: core-replay-ubuntu-24.04
          save-if: false
      - name: Replay captured Core output through the real emulator
        run: cargo test --locked -p sheprd-terminal captured_core_ -- --nocapture --test-threads=1
  probe:
    needs: replay
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-native'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native-windows-2025
          save-if: false
      - name: Stage the checksum-pinned private Herdr
        run: |
          binary=$(python scripts/install-herdr-windows.py "$RUNNER_TEMP/herdr")
          printf 'HERDR_TEST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Prepare the disposable desktop
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/set-display-resolution.ps1
      - name: Check formatting and compile the native harness
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p sheprd-gpui --features integration-test --test accessibility_windows -- -D warnings
      - name: Test the fixed input contract
        run: |
          cargo test --locked -p sheprd-terminal captured_core_ -- --nocapture --test-threads=1
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows non_us::matrix::tests:: -- --nocapture --test-threads=1
          cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport captured_core_pipeline -- --nocapture --test-threads=1
          cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport captured_core_frame_samples -- --nocapture --test-threads=1
          cargo test --locked -p sheprd-gpui --features integration-test --bin spaceport search_input::tests::accessibility:: -- --nocapture --test-threads=1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File crates/sheprd-gpui/tests/support/uia_shortcut_matrix.ps1 -CaseId console-attachment -ValidateContract
      - name: Qualify the real pane console and its keys
        run: |
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows non_us::matrix::console::native_pane_program_keeps_bare_function_and_control_page_keys -- --ignored --exact --nocapture --test-threads=1
      - name: Qualify digits punctuation and revised defaults
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows non_us::matrix::native_ -- --ignored --nocapture --test-threads=1
      - name: Qualify Polish AltGr letters and both restoration paths
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows non_us::native_altgr_text_survives_the_workspace_shortcut_and_restores_layouts -- --ignored --exact --nocapture --test-threads=1
      - name: Retain the direct chrome shortcut qualification
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows ui_automation_names_the_chrome_and_ctrl_f6_reaches_it -- --ignored --exact --nocapture --test-threads=1
      - name: Qualify the native Settings selection acknowledgement
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows settings::native_settings_keyboard_persistence_and_painted_focus_ring -- --ignored --exact --nocapture --test-threads=1
      - name: Stage the checksum-pinned private Core
        if: ${{ !cancelled() }}
        run: |
          core_binary=$(python scripts/install-herdr-windows.py --core "$RUNNER_TEMP/herdr-core")
          printf 'HERDR_CORE_TEST_BINARY=%s\n' "$core_binary" >> "$GITHUB_ENV"
      - name: Diagnose native Core text and retain its other contracts
        if: ${{ !cancelled() }}
        run: |
          result=0
          if ! cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows core:: -- --ignored --nocapture --test-threads=1; then
            result=1
          fi
          for sample in 1 2 3 4 5 6; do
            printf 'CORE_REPRO_SAMPLE %s/6\n' "$sample"
            if ! cargo test --locked -p sheprd-gpui --features integration-test --test accessibility_windows core::native_core_text_caret_bounds_and_output_changes_match_the_real_runtime -- --ignored --exact --nocapture --test-threads=1; then
              result=1
            fi
          done
          exit "$result"
