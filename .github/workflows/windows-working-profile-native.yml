# ABOUTME: Profiles the normal release app with owned private terminal runtimes.
# ABOUTME: Launches only through the native run branch and uploads encrypted evidence.
name: Windows working native profile

on:
  push:
    branches: [fix/review-squad-windows-profile-native]

permissions: {}

concurrency:
  group: windows-working-native-profile
  cancel-in-progress: false

jobs:
  profile:
    if: >-
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
      github.event_name == 'push' && github.ref == 'refs/heads/fix/review-squad-windows-profile-native'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: working-native-symbols-windows-x64
          save-if: false
      - name: Prepare the private fixture parent and installed reader
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtures = Join-Path $env:RUNNER_TEMP 'spaceport-working-profile-data'
          if (Test-Path $fixtures) { throw 'Refusing an existing fixture parent.' }
          [IO.Directory]::CreateDirectory($fixtures) | Out-Null
          "HERDR_TEST_TMPDIR=$fixtures" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $reader = Get-Command xperf.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          "SPACEPORT_WORKING_PROFILE_XPERF=$($reader.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage the checksum-pinned TUI fixture
        run: |
          set -euo pipefail
          profile_herdr_binary=$(python scripts/install-herdr-windows.py "$RUNNER_TEMP/herdr-profile")
          printf 'HERDR_TEST_BINARY=%s\n' "$profile_herdr_binary" >> "$GITHUB_ENV"
      - name: Stage the checksum-pinned Core fixture
        run: |
          set -euo pipefail
          profile_core_binary=$(python scripts/install-herdr-windows.py --core "$RUNNER_TEMP/herdr-core-profile")
          printf 'HERDR_CORE_TEST_BINARY=%s\n' "$profile_core_binary" >> "$GITHUB_ENV"
      - name: Prepare the native display
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/set-display-resolution.ps1
      - name: Prepare and verify animations on the disposable desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $result = ./scripts/profile/desktop-animations.ps1 -Action Enable -EvidenceDirectory $env:HERDR_TEST_TMPDIR
          $result | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $env:HERDR_TEST_TMPDIR 'desktop-animation-enabled.json')
          $result | Write-Output
      - name: Build the release app and profile target with local symbols
        run: |
          set -euo pipefail
          cargo test --locked --release --target x86_64-pc-windows-msvc -p sheprd-gpui --features integration-test --test working_profile --no-run
          cargo metadata --locked --offline --no-deps --format-version 1 > "$RUNNER_TEMP/spaceport-profile-metadata.json"
      - name: Retain the exact executable and PDB identities
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'spaceport-profile-metadata.json') | ConvertFrom-Json
          $binaryRoot = Join-Path $metadata.target_directory 'x86_64-pc-windows-msvc/release'
          $destination = Join-Path $env:HERDR_TEST_TMPDIR 'build'
          [IO.Directory]::CreateDirectory($destination) | Out-Null
          $files = @(foreach ($name in @('spaceport.exe', 'spaceport.pdb')) {
            $inputFile = Join-Path $binaryRoot $name
            Copy-Item -LiteralPath $inputFile -Destination $destination
            [ordered]@{name = $name; sha256 = (Get-FileHash -Algorithm SHA256 $inputFile).Hash; bytes = (Get-Item $inputFile).Length}
          })
          [ordered]@{source = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; files = $files; qualification = 'unreviewed native capture'} |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $destination 'identity.json')
      - name: Profile controlled Working TUI beside private Core
        timeout-minutes: 15
        run: cargo test --locked --release --target x86_64-pc-windows-msvc -p sheprd-gpui --features integration-test --test working_profile working_tui_and_core_profile -- --ignored --exact --nocapture
      - name: Restore and verify the disposable desktop animation preference
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:HERDR_TEST_TMPDIR) {
            $original = Join-Path $env:HERDR_TEST_TMPDIR 'desktop-animation-original.json'
            if (Test-Path -LiteralPath $original) {
              $result = ./scripts/profile/desktop-animations.ps1 -Action Restore -EvidenceDirectory $env:HERDR_TEST_TMPDIR
              $result | Set-Content -Encoding UTF8 -LiteralPath (Join-Path $env:HERDR_TEST_TMPDIR 'desktop-animation-restored.json')
              $result | Write-Output
            }
          }
      # This is throwaway read-only analysis for qualifying the first trace exports.
      - name: Retain trace event classes and sampled CPU reports
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:_NT_SYMBOL_PATH = Join-Path $env:HERDR_TEST_TMPDIR 'build'
          $env:_NT_SYMCACHE_PATH = Join-Path $env:HERDR_TEST_TMPDIR 'analysis-cache'
          [IO.Directory]::CreateDirectory($env:_NT_SYMCACHE_PATH) | Out-Null
          $exports = @(
            @{ name = 'event-statistics'; arguments = @('-a', 'tracestats', '-timespan', 'actual', '-detail', 'stack') },
            @{ name = 'sampled-cpu'; arguments = @('-symbols', '-a', 'profile', '-detail') },
            @{ name = 'sample-frequency'; arguments = @('-a', 'profile', '-freq') }
          )
          $outcomes = @()
          $completed = 0
          foreach ($directory in @(Get-ChildItem -LiteralPath $env:HERDR_TEST_TMPDIR -Directory)) {
            foreach ($phaseName in @('idle-before', 'synthetic-working', 'idle-after')) {
              $phaseFile = Join-Path $directory.FullName "$phaseName.json"
              if (-not (Test-Path -LiteralPath $phaseFile -PathType Leaf)) { continue }
              try {
                $phase = Get-Content -LiteralPath $phaseFile -Raw | ConvertFrom-Json
                $measurement = Get-Content -LiteralPath (Join-Path $directory.FullName "$phaseName-measurement.json") -Raw | ConvertFrom-Json
                if ($measurement.stop_outcome -ne 'acknowledged' -or $measurement.pid -ne $phase.pid) { throw 'Phase lacks its matching acknowledged Stop.' }
                $trace = [IO.Path]::GetFullPath($phase.sample_path)
                $expected = Join-Path $directory.FullName "$phaseName.etl"
                if ($phase.phase -ne $phaseName -or $trace -ne $expected -or -not (Test-Path -LiteralPath $trace -PathType Leaf)) { throw 'Trace does not match its private phase.' }
                $completed++
              } catch {
                $outcomes += [ordered]@{directory = $directory.Name; phase = $phaseName; action = 'manifest'; success = $false; error = $_.Exception.Message}
                continue
              }
              foreach ($export in $exports) {
                $nativeExit = $null
                try {
                  $output = Join-Path $directory.FullName "$phaseName-$($export.name).txt"
                  if (Test-Path -LiteralPath $output) { throw 'Refusing an existing trace export.' }
                  $stdout = Join-Path $directory.FullName "$phaseName-$($export.name).stdout.log"
                  $stderr = Join-Path $directory.FullName "$phaseName-$($export.name).stderr.log"
                  $traceArguments = @('-i', $trace, '-o', $output) + $export.arguments
                  & $env:SPACEPORT_WORKING_PROFILE_XPERF @traceArguments 1> $stdout 2> $stderr
                  $nativeExit = $LASTEXITCODE
                  if ($nativeExit -ne 0) { throw "Trace export failed with exit $nativeExit." }
                  $length = (Get-Item -LiteralPath $output).Length
                  if ($length -eq 0 -or $length -gt 33554432) { throw 'Trace export is empty or exceeds 32 MiB.' }
                  $outcomes += [ordered]@{directory = $directory.Name; phase = $phaseName; action = $export.name; success = $true; exit_code = $nativeExit; bytes = $length}
                } catch {
                  $outcomes += [ordered]@{directory = $directory.Name; phase = $phaseName; action = $export.name; success = $false; exit_code = $nativeExit; error = $_.Exception.Message}
                }
              }
            }
          }
          [ordered]@{source = $env:GITHUB_SHA; completed_stopped_phases = $completed; cpu_attribution_qualified = $false; exports = $outcomes} |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $env:HERDR_TEST_TMPDIR 'trace-analysis.json')
          if ($completed -eq 0 -or @($outcomes | Where-Object { -not $_.success }).Count -ne 0) { throw 'Trace analysis is incomplete; private outcomes and partial exports remain for sealing.' }
      - name: Encrypt completed and partial private evidence
        id: seal
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: powershell
        run: |
          $recipient = Join-Path $env:GITHUB_WORKSPACE 'docs/evidence/review-squad/windows-profile/retention-public.asc'
          $sealed = Join-Path $env:RUNNER_TEMP 'spaceport-working-native.zip.gpg'
          & ./scripts/profile/encrypt-artifacts.ps1 -SourceDirectory $env:HERDR_TEST_TMPDIR -RecipientFile $recipient -OutputFile $sealed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
        with:
          name: spaceport-working-native-encrypted
          path: ${{ runner.temp }}/spaceport-working-native.zip.gpg
          if-no-files-found: error
          retention-days: 7
