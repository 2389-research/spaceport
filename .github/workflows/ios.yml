name: iOS

# The native app in ios/ (docs/ios-app-plan.md). Pull requests and main run
# Swift package tests and an unsigned simulator build.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      # Design mockups: their own project, not built here.
      - '!ios/Mockups/**'
      # The daemon's wire types, which write the Swift tests' fixtures.
      - 'crates/sheprd-remote-control/src/native.rs'
      - 'crates/sheprd-remote-control/src/native/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '!ios/**/*.md'
      # Design mockups: their own project, not built here.
      - '!ios/Mockups/**'
      # The daemon's wire types, which write the Swift tests' fixtures.
      - 'crates/sheprd-remote-control/src/native.rs'
      - 'crates/sheprd-remote-control/src/native/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Swift tests and simulator build
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the Xcode in use
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Swift package tests (fixtures shared with the daemon's Rust tests)
        run: cd ios/SheprdRemoteCore && swift test
      - name: Unsigned simulator build of the app and its extensions
        run: |
          cd ios
          xcodegen -q
          python3 tools/test_branding.py
          xcodebuild -project SheprdRemote.xcodeproj -scheme SheprdRemote \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
