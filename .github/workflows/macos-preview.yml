name: macOS signed preview
run-name: macOS preview ${{ inputs.version || github.ref_name }} at ${{ inputs.expected_sha || github.sha }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main commit SHA to build and sign
        required: true
        type: string
      version:
        description: Immutable preview version YYYYMMDD.COUNTER
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-signed-preview
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: >-
      github.repository == '2389-research/spaceport' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.request.outputs.version }}
      sha: ${{ steps.request.outputs.sha }}
      tag: ${{ steps.request.outputs.tag }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, commit and main ancestry
        id: request
        run: python3 scripts/release/preview-request.py
      - name: Reserve this version against complete workflow history
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.request.outputs.version }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: python3 scripts/release/preview-history.py

  ci-gate:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Require full CI on the exact main commit before signing
        run: python3 scripts/release/check-ci.py "$EXPECTED_SHA" --wait --repo 2389-research/spaceport --actor harperreed

  build:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: none
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - uses: ./.github/actions/macos-build-cache # zizmor: ignore[self-repository] use the fixed checkout SHA
        with:
          flavor: preview
      - name: Generate preview notes without signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/preview-notes
          base=$(python3 scripts/release/preview-notes-base.py)
          bash scripts/release/generate-changelog.sh --macos-preview "$VERSION" target/preview-notes "$base"
          printf '\nWorkflow: https://github.com/2389-research/spaceport/actions/runs/%s\n' "$GITHUB_RUN_ID" >> target/preview-notes/RELEASE_NOTES.md
      - name: Build unsigned release-profile arm64 preview and smoke actual CLI
        # build-macos.sh runs smoke-cli.py on the exact binary before packaging.
        run: bash scripts/release/build-macos.sh "$VERSION" release arm64 unsigned
      - name: Archive only this run's unsigned bundle
        run: |
          set -euo pipefail
          mkdir -p target/preview-input
          ditto -c -k --keepParent "target/distribution/$VERSION-release-arm64/Spaceport.app" target/preview-input/Spaceport.zip
          cp target/preview-notes/RELEASE_NOTES.md target/preview-input/
          cd target/preview-input
          shasum -a 256 Spaceport.zip RELEASE_NOTES.md > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-unsigned-${{ github.run_id }}
          path: target/preview-input/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [validate, build, ci-gate]
    if: >-
      github.repository == '2389-research/spaceport' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed'
    environment: macos-preview
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate current tag and main ancestry
        run: python3 scripts/release/preview-request.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-preview-unsigned-${{ github.run_id }}
          path: target/preview-input
      - name: Check and unpack the same-run artifact
        run: |
          set -euo pipefail
          cd target/preview-input
          shasum -a 256 -c SHA256SUMS
          ditto -x -k Spaceport.zip .
          mkdir -p ../preview-signed
          cp RELEASE_NOTES.md ../preview-signed/
      - name: Recheck immutable version before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/preview-history.py
      - name: Acquire the pinned SDK before using credentials
        run: |
          if [[ ! -x "$(brew --prefix openssl@3)/bin/openssl" ]]; then
            brew install --force-bottle openssl@3
          fi
          python3 scripts/release/sparkle_framework.py acquire target/sparkle-sdk
          {
            echo "SPARKLE_FRAMEWORK_PATH=$PWD/target/sparkle-sdk"
            echo "SPACEPORT_OPENSSL=$(brew --prefix openssl@3)/bin/openssl"
          } >> "$GITHUB_ENV"
      - name: Sign and notarize with the protected Developer ID identity
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/release/sign-macos.sh "$VERSION" target/preview-input/Spaceport.app target/preview-signed arm64 import
      - name: Verify the final mounted image and write its checksum
        run: bash scripts/release/verify-macos-preview.sh "$VERSION" release target/preview-signed
      - name: Sign the final update archive and appcast with the protected preview key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 scripts/release/sparkle-feed.py create "$VERSION" \
            "target/preview-signed/Spaceport-$VERSION-arm64-apple-darwin.dmg" \
            target/preview-signed/RELEASE_NOTES.md target/preview-signed/appcast.xml \
            --tool target/sparkle-sdk/bin/sign_update
      - name: Retain completed preview and submission diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-preview-signed-${{ github.run_id }}
          path: |
            target/preview-signed/
            target/notarization/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [validate, sign]
    if: >-
      github.event_name == 'push' && needs.validate.outputs.tag != '' &&
      github.repository == '2389-research/spaceport' &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-preview-signed-${{ github.run_id }}
          path: target/preview-result
      - name: Refuse moved or unmerged tags before publishing
        run: python3 scripts/release/preview-request.py
      - name: Publish the verified DMG and checksum as a macOS prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$PWD/target/preview-result/preview-signed/RELEASE_NOTES.md"
          cd target/preview-result/preview-signed
          file="Spaceport-$VERSION-arm64-apple-darwin.dmg"
          test -f "$file"
          test "$(cat SHA256SUMS)" = "$(shasum -a 256 "$file")"
          shasum -a 256 -c SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/release/sparkle-feed.py" verify appcast.xml --archive "$file"
          gh release create "$TAG" "$file" SHA256SUMS --repo 2389-research/spaceport --verify-tag --prerelease --title "Spaceport $VERSION (macOS preview)" --notes-file "$notes"
      - name: Publish signed feed after verifying the immutable public archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/publish-sparkle-feed.py target/preview-result/preview-signed/appcast.xml "$EXPECTED_SHA"
