name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
# Fork PRs rely on Settings > Actions > General > Require approval for all
# external contributors. Approval permits execution, not access to secrets:
# keep pull_request, hosted runners, and secret-free/read-only PR jobs.
permissions: {}

# Keep a running main check available to release qualification. A newer PR
# push still replaces its previous check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every rust-cache entry shares the repository's 10 GB budget. With full
# debug info the entries overflowed it, and GitHub evicted the Windows
# checks' caches between main runs, so they compiled from scratch. Without
# debug info dependencies cache about 40% smaller and build faster; panics
# still report file and line. Release profiles keep their own settings.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  # Audits the workflows themselves for injection, over-broad permissions,
  # unpinned actions, and credential persistence. Gates the application
  # jobs to catch workflow mistakes early; GitHub's fork isolation and protected
  # release environments remain the credential boundary, not the scanner.
  zizmor:
    if: >-
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          online-audits: false

  # The release changelog is generated from these subjects, so a bad one is a
  # release defect. Local commits are caught earlier by `just hooks`.
  commits:
    if: >-
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    name: Commit messages
    needs: zizmor
    outputs:
      code: ${{ steps.changes.outputs.code }}
      windows_package: ${{ steps.changes.outputs.windows_package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range being checked is history the default shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit subject the changelog will publish
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A first push or a rewritten branch has no usable base; check the
          # tip alone rather than every commit that ever reached the repository.
          if [[ ! $BASE =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$HEAD_SHA~1"
          fi
          python3 scripts/release/check-commit-messages.py range "$BASE..$HEAD_SHA"
      - name: Detect build and test inputs
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  checks:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    name: Format, lint, and test (${{ matrix.runner }}, ${{ matrix.features }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        # macOS 14, the oldest supported release, is off: every macOS job
        # shares one account-wide runner limit with the release. Add it back
        # if a macOS 14 regression shows up:
        # runner: [macos-14, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
        # The two test passes each take most of the job, so they run side by
        # side, each with one of the lints; the script checks ride with the
        # default-features pass.
        features: [default, all]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        env:
          SPACEPORT_CI_APT_MIRROR: '1'
        run: bash scripts/install-linux-deps.sh
      - name: Restore and validate the pinned macOS update framework
        if: runner.os == 'macOS'
        uses: ./.github/actions/sparkle-sdk # zizmor: ignore[self-repository] use the fixed checkout SHA
      - name: Configure native update framework tests
        if: runner.os == 'macOS'
        run: |
          if [[ ! -x "$(brew --prefix openssl@3)/bin/openssl" ]]; then
            brew install --force-bottle openssl@3
          fi
          {
            echo "SPACEPORT_OPENSSL=$(brew --prefix openssl@3)/bin/openssl"
          } >> "$GITHUB_ENV"
      - name: Test release scripts and security contracts without credentials
        if: matrix.features == 'default'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          jq --version
          python3 -m unittest discover -s scripts/release/tests -v
          python3 scripts/release/test-release-security.py
          python3 scripts/test_ubuntu_ci_sources.py
          python3 -m unittest discover -s assets/icons -p 'test_*.py'
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: checks-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check
      - name: Check source file sizes
        if: matrix.features == 'default'
        run: bash scripts/check-file-size.sh
      - name: Check keep-sorted regions
        if: matrix.features == 'default'
        run: |
          python3 scripts/test_check_sorted.py
          python3 scripts/check-sorted.py
      - name: Check Fluent messages
        if: matrix.features == 'default'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/test_check_i18n.py
          python3 scripts/check-i18n.py
      - name: Lint every target and feature
        if: matrix.features == 'all'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lint without default features
        if: matrix.features == 'default'
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Test default features and executable CLI
        if: matrix.features == 'default'
        run: cargo test --locked --workspace
      - name: Test integration-feature build and executable CLI
        if: matrix.features == 'all'
        run: cargo test --locked --workspace --all-features
      - name: Test native macOS routing without an unlocked desktop
        if: runner.os == 'macOS' && matrix.features == 'all'
        run: cargo test --locked -p sheprd-gpui --features integration-test --test live_gui sidebar_routing::native_host_routing -- --ignored --exact --nocapture --test-threads=1

  # Spaceport Windows jobs are paused until Kata h8g5 fixes native performance.
  # Keep the jobs and their budgets intact for re-enabling qualification.
  # Match the other platforms' Rust checks without an extra optimized build.
  # Native GUI tests run in windows-native; the optimized Windows build runs
  # in windows-package.
  windows:
    if: >-
      vars.WINDOWS_ENABLED == 'true' &&
      needs.commits.outputs.code == 'true' &&
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    name: Windows check (${{ matrix.runner }}, ${{ matrix.features }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
        # Split as in the checks job: each test pass with one of the lints.
        features: [default, all]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.runner }}-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: matrix.features == 'default'
        run: cargo fmt --all -- --check
      - name: Lint every target and feature
        if: matrix.features == 'all'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Lint without default features
        if: matrix.features == 'default'
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings
      - name: Test default features and executable CLI
        if: matrix.features == 'default'
        run: cargo test --locked --workspace
      - name: Test integration-feature build and executable CLI
        if: matrix.features == 'all'
        run: cargo test --locked --workspace --all-features

  # The native GUI tests (`just test-gui`, `just test-sidebar`) on a real
  # Windows desktop session against a pinned, checksummed Herdr daemon in the
  # shared test sandbox, then the release-mode performance budget
  # (`just test-perf`). Hosted runners have no GPU, so Direct3D runs on WARP:
  # the budget is a regression tripwire, not a target for real hardware.
  windows-native:
    if: >-
      vars.WINDOWS_ENABLED == 'true' &&
      needs.commits.outputs.code == 'true' &&
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    name: Windows native GUI (${{ matrix.runner }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: native-${{ matrix.runner }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned Herdr daemon
        run: echo "HERDR_TEST_BINARY=$(python scripts/install-herdr-windows.py "$RUNNER_TEMP/herdr")" >> "$GITHUB_ENV"
      # Runners start at 1024x768; the sidebar fixture skips, and counts, any
      # window size the display cannot hold if this is refused.
      - name: Raise the desktop resolution
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/set-display-resolution.ps1
      # Herdr publishes no ARM64 Windows build. Under x64 emulation on
      # windows-11-arm its panes echo typed text but never act on Enter, so
      # the live-daemon test runs on x64; the native fixtures run on both.
      - name: Native window, input, and live-daemon tests
        env:
          RUNNER: ${{ matrix.runner }}
        run: |
          skip=()
          if [[ $RUNNER == windows-11-arm ]]; then skip=(--skip native_gui_live); fi
          cargo test --locked -p sheprd-gpui --features integration-test --test live_gui -- --ignored --nocapture --test-threads=1 "${skip[@]}"
      - name: Release-mode performance budget
        env:
          HERDR_PERF_P95_MS: '100'
        run: |
          cargo test --locked --release -p sheprd-gpui --features integration-test --test performance_gui dense_terminal_sidebar_performance -- --ignored --nocapture --exact

  # The optimized Windows build, its zip, and its installer, made and installed
  # as a release would, so a packaging or installer mistake fails the
  # pull request rather than a release. A release build is too slow for every
  # change, so this runs only when what those artifacts are made from changes.
  windows-package:
    if: >-
      vars.WINDOWS_ENABLED == 'true' &&
      needs.commits.outputs.windows_package == 'true' &&
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    name: Windows package and installer
    needs: [zizmor, commits]
    runs-on: windows-2025
    timeout-minutes: 60
    # The steps read "$TARGET" and friends, so they run under Bash.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      # Packaging names files after a release version; any valid one will do.
      VERSION: '20000101.1'
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The other jobs that run scripts/release/tests are macOS and Linux,
      # where the shortcut test skips; run it here, before the slow build.
      - name: Test the install script's Start menu shortcut
        run: python scripts/release/tests/test_install_ps1.py -v
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized Windows executables
        run: cargo build --locked --release -p sheprd-gpui -p sheprd-launcher -p sheprd-acp --target "$TARGET"
      - name: Smoke-test the optimized executable as the release does
        run: python scripts/release/smoke-cli.py "target/$TARGET/release/spaceport.exe"
      # The release job passes generated third-party notices; any nonempty
      # file exercises the same packaging.
      - name: Package the Windows zip
        run: |
          mkdir dist
          python scripts/release/package-windows.py "$VERSION" "$TARGET" "target/$TARGET/release/spaceport.exe" "target/$TARGET/release/spaceport-launcher.exe" dist LICENSE
      - name: Install the pinned Inno Setup compiler
        run: python scripts/release/windows-installer.py install-iscc "$RUNNER_TEMP/inno-setup" > "$RUNNER_TEMP/iscc-path"
      - name: Build the Windows installer
        run: python scripts/release/windows-installer.py build "$VERSION" "$TARGET" "dist/Sheprd-$VERSION-$TARGET.zip" dist "$(cat "$RUNNER_TEMP/iscc-path")"
      - name: Install and uninstall the Windows installer
        run: python scripts/release/windows-installer.py smoke "dist/Sheprd-$VERSION-$TARGET-setup.exe"

  # Keep the branch-protection context stable while requiring active platforms.
  checks-passed:
    name: Format, lint, and test
    needs: [checks, windows, windows-native, windows-package, build-macos, commits]
    if: >-
      always() &&
      github.repository == '2389-research/spaceport' &&
      (github.event_name == 'pull_request' ||
       ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        github.actor == 'harperreed' && github.triggering_actor == 'harperreed' &&
        github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all platform checks
        env:
          RESULT: ${{ needs.checks.result }}
          WINDOWS_ENABLED: ${{ github.repository != '2389-research/spaceport' }}
          WINDOWS: ${{ needs.windows.result }}
          NATIVE: ${{ needs.windows-native.result }}
          PACKAGE: ${{ needs.windows-package.result }}
          MACOS_RELEASE: ${{ needs.build-macos.result }}
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ needs.commits.result }}
          CODE: ${{ needs.commits.outputs.code }}
          PACKAGE_INPUTS: ${{ needs.commits.outputs.windows_package }}
        run: |
          test "$COMMITS" = success || exit 1
          if [ "$CODE" = true ]; then
            test "$RESULT" = success || exit 1
          else
            test "$CODE" = false && test "$RESULT" = skipped || exit 1
          fi
          # The macOS release builds run on pull requests only.
          if [ "$CODE" = true ] && [ "$EVENT" = pull_request ]; then
            test "$MACOS_RELEASE" = success || exit 1
          else
            test "$MACOS_RELEASE" = skipped || exit 1
          fi
          if [ "$WINDOWS_ENABLED" = false ]; then
            test "$WINDOWS" = skipped && test "$NATIVE" = skipped && test "$PACKAGE" = skipped
          elif [ "$WINDOWS_ENABLED" = true ]; then
            if [ "$CODE" = true ]; then
              test "$WINDOWS" = success && test "$NATIVE" = success || exit 1
            else
              test "$WINDOWS" = skipped && test "$NATIVE" = skipped || exit 1
            fi
            if [ "$PACKAGE_INPUTS" = true ]; then
              test "$PACKAGE" = success
            else
              test "$PACKAGE_INPUTS" = false && test "$PACKAGE" = skipped
            fi
          else
            exit 1
          fi

  # Linux release builds on main, which the release gate requires. The release
  # workflow builds the same targets but only smoke-tests what it ships.
  build:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == '2389-research/spaceport' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.actor == 'harperreed' && github.triggering_actor == 'harperreed'
    name: Release (${{ matrix.target }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        env:
          SPACEPORT_CI_APT_MIRROR: '1'
        run: bash scripts/install-linux-deps.sh
      - name: Install pinned Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build optimized executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p sheprd-gpui --target "$TARGET"
      # The full CLI suite in release mode, for this commit; the release
      # workflow only smoke-tests the bytes it ships, since `cargo test`
      # rebuilds the executable with dev-dependency features.
      - name: Exercise release executable without opening a window
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --release -p sheprd-gpui --test cli --target "$TARGET"

  # The macOS release builds and their release-mode CLI suite, on pull
  # requests only. On main they would hold two of the account-wide macOS
  # runners that the macOS preview and cache workflows also use. The separate
  # dependency warmer supplies main caches without adding PR cache copies.
  build-macos:
    if: >-
      needs.commits.outputs.code == 'true' &&
      github.repository == '2389-research/spaceport' &&
      github.event_name == 'pull_request'
    name: Release (${{ matrix.target }})
    needs: [zizmor, commits]
    strategy:
      fail-fast: false
      matrix:
        # x86_64 macOS cross-compiles on Apple Silicon and runs under Rosetta;
        # Intel runners are scarce.
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: Require Rosetta for the x86_64 macOS executable
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: ./.github/actions/macos-build-cache # zizmor: ignore[self-repository] use the fixed checkout SHA
        with:
          flavor: ${{ matrix.target }}
      - name: Build optimized executable
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p sheprd-gpui --target "$TARGET"
      # Rosetta translates an x86_64 executable on its first launch, which
      # outlasts the CLI suite's 10 second limit when several tests start it
      # at once. Build the suite's own executable (it differs from the one
      # above) and launch it once, so the tests find it translated.
      - name: Translate the x86_64 test executable once
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo test --locked --release -p sheprd-gpui --test cli --target "$TARGET" --no-run
          "target/$TARGET/release/spaceport" --build-info
      - name: Exercise release executable without opening a window
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --release -p sheprd-gpui --test cli --target "$TARGET"
