# ABOUTME: Share unsigned macOS dependency caches and pinned release tools.
# ABOUTME: Keep writers on main and leave signing jobs outside the cache path.
name: Restore macOS build inputs
description: Reuse Cargo dependencies, pinned tools and validated public SDK bytes.
inputs:
  flavor:
    description: preview, aarch64-apple-darwin or x86_64-apple-darwin.
    required: true
  write:
    description: Save dependency caches from the trusted main warmer only.
    default: 'false'
runs:
  using: composite
  steps:
    - id: host
      name: Identify the native compiler environment
      shell: bash
      run: |
        os_build=$(sw_vers -buildVersion)
        xcode_hash=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
        echo "key=$os_build-$xcode_hash" >> "$GITHUB_OUTPUT"
        echo 'tools=cargo-about@0.9.2,git-cliff@2.12.0' >> "$GITHUB_OUTPUT"
    - name: Restore compiled dependencies and Cargo downloads
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: macos-release-${{ inputs.flavor }}-${{ steps.host.outputs.key }}-${{ inputs.flavor == 'preview' && hashFiles('scripts/release/sparkle.json') || 'native' }}
        env-vars: MACOSX_DEPLOYMENT_TARGET CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP
        cache-bin: false
        # Preserve Cargo's dependency cleanup, but exclude packaging output directories.
        cache-targets: false
        cache-directories: |
          target/release
          target/*-apple-darwin/release
        cache-workspace-crates: false
        save-if: ${{ inputs.write == 'true' }}
    - if: inputs.flavor == 'preview'
      uses: ./.github/actions/sparkle-sdk # zizmor: ignore[self-repository] use the fixed checkout SHA
      with:
        write: ${{ inputs.write }}
    - id: tools
      if: inputs.flavor == 'preview'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/spaceport-release-tools/cargo-about
          ${{ runner.temp }}/spaceport-release-tools/git-cliff
        key: macos-tools-${{ runner.arch }}-${{ steps.host.outputs.key }}-${{ hashFiles('.github/actions/macos-build-cache/action.yml') }}
    - name: Install checksummed pinned tool binaries on misses
      if: inputs.flavor == 'preview' && steps.tools.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: ${{ steps.host.outputs.tools }}
        checksum: true
        fallback: none
    - name: Stage tool binaries and verify their versions
      if: inputs.flavor == 'preview'
      shell: bash
      env:
        TOOL_SPECS: ${{ steps.host.outputs.tools }}
      run: | # zizmor: ignore[github-env] fixed runner-owned directory; exact trusted tool files only
        tools_directory="$RUNNER_TEMP/spaceport-release-tools"
        bash scripts/release/cache-release-tools.sh "$tools_directory" cargo-about git-cliff
        echo "$RUNNER_TEMP/spaceport-release-tools" >> "$GITHUB_PATH"
        for spec in ${TOOL_SPECS//,/ }; do
          tool=${spec%@*}
          version=${spec#*@}
          test "$("$tools_directory/$tool" --version)" = "$tool $version"
        done
    - if: inputs.flavor == 'preview' && inputs.write == 'true' && steps.tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/spaceport-release-tools/cargo-about
          ${{ runner.temp }}/spaceport-release-tools/git-cliff
        key: ${{ steps.tools.outputs.cache-primary-key }}
