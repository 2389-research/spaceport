[package]
edition.workspace      = true
license.workspace      = true
name                   = "spaceport-control-protocol"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
spaceport-client.workspace = true
serde.workspace        = true
serde_json.workspace   = true
spaceport-i18n.workspace   = true
# Only for `test-support`: its socket addresses live in private temporary directories.
tempfile               = { optional = true, workspace = true }
thiserror.workspace    = true
tracing.workspace      = true

# The pipe is created with a DACL; `spaceport_client::private_endpoint` reads the
# user and the pipe owner it is checked against.
[target.'cfg(windows)'.dependencies]
interprocess.workspace = true

[dev-dependencies]
serde_json.workspace = true
spaceport-i18n       = { features = ["test-support"], workspace = true }
tempfile.workspace   = true

[features]
# Fresh socket addresses for the app's control server tests.
test-support = ["dep:tempfile"]
