[package]
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-browser"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The GPUI test harness settles motions and reads fixtures at once; a normal
# build runs their real durations. A cargo feature, not `cfg!(test)`, because
# a dependency's own `cfg(test)` is false inside its consumers' test builds.
test-support = []

[dependencies]
gpui.workspace              = true
serde.workspace             = true
serde_json.workspace        = true
sheprd-client.workspace     = true
sheprd-motion.workspace     = true
sheprd-panes.workspace      = true
sheprd-reorder.workspace    = true
sheprd-state-file.workspace = true
sheprd-truncate.workspace   = true
thiserror.workspace         = true
tracing.workspace           = true
url.workspace               = true
uuid.workspace              = true

[dev-dependencies]
gpui = { features = ["test-support"], workspace = true }
sheprd-backend.workspace = true
tempfile.workspace       = true
