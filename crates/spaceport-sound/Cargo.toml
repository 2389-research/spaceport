[package]
edition.workspace      = true
license.workspace      = true
name                   = "spaceport-sound"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
rodio.workspace              = true
serde.workspace              = true
spaceport-lenient.workspace  = true
spaceport-protocol.workspace = true
spaceport-settings.workspace = true
spaceport-i18n.workspace     = true
thiserror.workspace          = true
toml.workspace               = true
# The worker logs a failed settings load and a sound it could not play.
tracing.workspace            = true

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK` on a configured sound file, so a FIFO cannot block the worker.
rustix.workspace = true

[features]
# `Policy::waiting`, `Service::recording`/`recording_volume`, and the device
# suppression in `Service::new`, for the app's headless tests.
test-support = []

[dev-dependencies]
spaceport-i18n = { features = ["test-support"], workspace = true }
# The policy tests read the protocol's own endpoint snapshot fixture.
serde_json.workspace = true
tempfile.workspace   = true
