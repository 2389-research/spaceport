[package]
edition.workspace      = true
license.workspace      = true
name                   = "spaceport-keymap"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# What the app's own tests read from here: `secondary_key`, the keystroke
# identity and matching rules, and the system keys no command holds. A cargo
# feature, not `cfg(test)`, because a dependency's own `cfg(test)` is false
# inside its consumers' test builds.
test-support = []

[dependencies]
gpui.workspace               = true
spaceport-client.workspace   = true
spaceport-commands.workspace = true
spaceport-i18n.workspace     = true
spaceport-settings.workspace = true
thiserror.workspace          = true
toml.workspace               = true

[dev-dependencies]
spaceport-i18n = { features = ["test-support"], workspace = true }
# The platform's spelling of a catalog shortcut, for the tests that compare a
# resolved keymap against the catalog's own defaults.
spaceport-commands = { features = ["test-support"], workspace = true }
