[package]
edition.workspace      = true
license.workspace      = true
name                   = "spaceport-sidebar"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The GPUI test harness enables this so a drag reports its phase and the gap
# it holds, and the slide says where it has settled, to the app's tests; a
# normal build keeps them to itself. A cargo feature, not `cfg(test)`, because
# a dependency's own `cfg(test)` is false inside its consumers' test builds.
test-support = []

[dependencies]
gpui.workspace               = true
serde.workspace              = true
serde_json.workspace         = true
spaceport-client.workspace   = true
spaceport-commands.workspace = true
spaceport-icons.workspace    = true
spaceport-motion.workspace   = true
spaceport-reorder.workspace  = true
spaceport-settings.workspace = true
thiserror.workspace          = true
unicode-width.workspace      = true

[dev-dependencies]
anyhow.workspace   = true
gpui               = { features = ["test-support"], workspace = true }
spaceport-settings = { features = ["test-support"], workspace = true }
tempfile.workspace = true
