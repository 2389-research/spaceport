[package]
edition.workspace      = true
license.workspace      = true
name                   = "spaceport-endpoint"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
spaceport-client.workspace  = true
# The live state a host's link is read from.
spaceport-live.workspace    = true
spaceport-reorder.workspace = true
thiserror.workspace         = true
tracing.workspace           = true

[target.'cfg(target_os = "macos")'.dependencies]
# The network path monitor: a block on its own queue, which only counts.
block2.workspace    = true
dispatch2.workspace = true

[features]
# `Link`, `Failure` and the fixture writes the app's headless tests install a
# link with, and `ConnectionRef::for_test`.
test-support = []

[dev-dependencies]
# The history and focus tests read the protocol's own endpoint snapshot
# fixture, as the app's did.
serde_json.workspace = true
# The catalog tests keep a private state file in a directory of their own.
tempfile.workspace   = true
