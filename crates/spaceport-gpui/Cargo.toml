[package]
edition.workspace      = true
license.workspace      = true
name                   = "spaceport-gpui"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[[bin]]
name = "spaceport"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
url.workspace = true
anyhow.workspace               = true
base64.workspace               = true
chrono.workspace               = true
config_loader.workspace        = true
futures-channel.workspace      = true
gpui.workspace                 = true
# Unlike gpui 0.2.2, the platform crate enables nothing by default: without
# font-kit (macOS) or a Linux backend, text silently goes to a no-op system.
gpui_platform                  = { features = ["font-kit", "runtime_shaders", "wayland", "x11"], workspace = true }
spaceport-ago.workspace           = true
spaceport-chat-core.workspace     = true
spaceport-chat-protocol.workspace = true
spaceport-backend.workspace       = true
spaceport-browser.workspace       = true
spaceport-client.workspace        = true
spaceport-commands.workspace      = true
spaceport-control-protocol.workspace = true
spaceport-core-client.workspace   = true
spaceport-diagnostics.workspace   = true
spaceport-endpoint.workspace      = true
spaceport-i18n.workspace          = true
spaceport-icons.workspace         = true
spaceport-keymap.workspace        = true
spaceport-live.workspace          = true
spaceport-menu.workspace          = true
spaceport-motion.workspace        = true
spaceport-osc52.workspace         = true
spaceport-palette.workspace       = true
spaceport-panes.workspace         = true
spaceport-release-notes.workspace = true
spaceport-remote.workspace        = true
spaceport-reorder.workspace      = true
spaceport-settings.workspace     = true
spaceport-settings-window.workspace = true
spaceport-sidebar.workspace      = true
spaceport-sound.workspace         = true
spaceport-state-file.workspace    = true
spaceport-textfield.workspace     = true
spaceport-truncate.workspace      = true
spaceport-widgets.workspace      = true
spaceport-words.workspace         = true
image                          = { features = ["bmp", "tiff"], workspace = true }
keepawake.workspace            = true
mermaid-rs-renderer.workspace  = true
nucleo-matcher.workspace       = true
pulldown-cmark.workspace       = true
ratex-layout.workspace         = true
ratex-parser.workspace         = true
ratex-render.workspace         = true
ratex-types.workspace          = true
serde.workspace                = true
serde_json.workspace           = true
sysinfo.workspace              = true
tempfile.workspace             = true
thiserror.workspace            = true
toml.workspace                 = true
toml_edit.workspace            = true
tracing.workspace              = true
unicode-properties.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace        = true
ureq.workspace                 = true
uuid.workspace                 = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
# `window/image_source/tests.rs` builds the checksums of a PNG fixture.
flate2.workspace = true
# `tests/live_gui/shutdown.rs` and `saved_state.rs` hash the sandbox state.
sha2.workspace = true
gpui = { features = ["test-support"], workspace = true }
spaceport-browser = { features = ["test-support"], workspace = true }
spaceport-client = { features = ["test-support"], workspace = true }
spaceport-reorder = { features = ["test-support"], workspace = true }
spaceport-settings = { features = ["test-support"], workspace = true }
spaceport-sidebar = { features = ["test-support"], workspace = true }
spaceport-widgets = { features = ["test-support"], workspace = true }
spaceport-sound = { features = ["test-support"], workspace = true }
spaceport-commands = { features = ["test-support"], workspace = true }
spaceport-remote = { features = ["test-support"], workspace = true }
spaceport-control-protocol = { features = ["test-support"], workspace = true }
spaceport-diagnostics = { features = ["test-support"], workspace = true }
spaceport-i18n = { features = ["test-support"], workspace = true }
spaceport-textfield = { features = ["test-support"], workspace = true }
spaceport-endpoint = { features = ["test-support"], workspace = true }
spaceport-keymap = { features = ["test-support"], workspace = true }
spaceport-live = { features = ["test-support"], workspace = true }
socket2.workspace = true
test-case.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

# `daemon/windows_tests.rs` serves private named pipes with chosen owners.
[target.'cfg(windows)'.dev-dependencies]
interprocess.workspace = true

[features]
default = []
macos-updater = ["dep:sparkle-updater"]
integration-test = [
  "gpui_platform/test-support",
  "objc2-app-kit/NSPasteboardItem",
  "objc2-app-kit/NSRunningApplication",
  "objc2-app-kit/NSWorkspace",
  "objc2-app-kit/libc",
  "dep:cocoa",
  "dep:core-graphics",
  "dep:foreign-types",
  "dep:objc",
  "spaceport-live/test-support",
  "spaceport-settings-window/integration-test",
]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# `windows-sys` sets the window attributes and reads the
# system settings GPUI leaves to the app, and opens avatar cache entries without following reparse points. It also
# registers with Restart Manager (`restart_manager`), and sends the
# performance fixture its window messages.
# `clipboard-win` reads the clipboard on a background thread (see
# `window/clipboard`). `windows` has the shell's COM and WinRT interfaces (the
# taskbar, the jump list, and toasts); `windows-registry` reads the link
# handler and the startup entry, failing with `windows-result` errors.
[target.'cfg(windows)'.dependencies]
clipboard-win.workspace     = true
raw-window-handle.workspace = true
windows = { features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
], workspace = true }
windows-registry.workspace = true
windows-result.workspace   = true
windows-sys = { features = [
  "Wdk_System_SystemServices",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Recovery",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
], workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite.workspace = true
nix.workspace          = true
oo7.workspace          = true

[target.'cfg(target_os = "macos")'.dependencies]
sparkle-updater = { optional = true, workspace = true }
font-kit.workspace              = true
block2.workspace                = true
objc2-core-foundation.workspace = true
objc2-user-notifications.workspace = true
cocoa                        = { optional = true, workspace = true }
core-graphics                = { optional = true, workspace = true }
foreign-types                = { optional = true, workspace = true }
nix.workspace                = true
objc                         = { optional = true, workspace = true }
objc2.workspace              = true
objc2-app-kit.workspace      = true
objc2-foundation.workspace   = true
raw-window-handle.workspace = true

[[test]]
name              = "live_gui"
required-features = ["integration-test"]

[[test]]
name              = "performance_gui"
required-features = ["integration-test"]

[[example]]
name              = "sparkle_fixture"
required-features = ["integration-test", "macos-updater"]
