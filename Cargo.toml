[workspace]
members  = ["crates/embed-resource", "crates/spaceport-acp", "crates/spaceport-activation", "crates/spaceport-ago", "crates/spaceport-backend", "crates/spaceport-browser", "crates/spaceport-chat-core", "crates/spaceport-chat-protocol", "crates/spaceport-client", "crates/spaceport-commands", "crates/spaceport-control-protocol", "crates/spaceport-core-client", "crates/spaceport-diagnostics", "crates/spaceport-endpoint", "crates/spaceport-gpui", "crates/spaceport-i18n", "crates/spaceport-icons", "crates/spaceport-keymap", "crates/spaceport-launcher", "crates/spaceport-lenient", "crates/spaceport-live", "crates/spaceport-menu", "crates/spaceport-motion", "crates/spaceport-osc52", "crates/spaceport-palette", "crates/spaceport-panes", "crates/spaceport-protocol", "crates/spaceport-release-notes", "crates/spaceport-remote", "crates/spaceport-reorder", "crates/spaceport-settings", "crates/spaceport-settings-window", "crates/spaceport-sidebar", "crates/spaceport-sound", "crates/spaceport-state-file", "crates/spaceport-terminal", "crates/spaceport-textfield", "crates/spaceport-truncate", "crates/spaceport-usage", "crates/spaceport-widgets", "crates/spaceport-words"]
resolver = "2"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.99"
# Cargo metadata only. Releases carry a derived calendar version YYYYMMDD.COUNTER
# that CI embeds as HERDR_RELEASE_VERSION; this value never reaches the UI.
version = "0.1.0"
# Workspace crates are not published to crates.io; they build this application.
publish = false

[workspace.lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
# Both lints are allow-by-default, so this table is what turns
# them on, and `-D warnings` in `just lint` and CI turns them into failures.
# A function that genuinely needs more carries a dated, scoped `#[allow]`.
# Their thresholds live in clippy.toml.
cognitive_complexity = { level = "warn", priority = 1 }
expect_used           = "deny"
too_many_lines       = { level = "warn", priority = 1 }
unwrap_used          = "deny"

[workspace.dependencies]
sparkle-updater = "=0.1.0"
# The terminal emulator behind herdr-core terminals, which arrive as raw bytes;
# Zed's fork, the revision Arbor runs. When upgrading, check that
# crates/spaceport-terminal/src/handler.rs forwards every `vte::ansi::Handler`
# method: a method it misses silently falls back to the trait's no-op default.
alacritty_terminal   = "0.26.0"
url = "2"
# ACP wire types for sheprd-acp; its own transport, so no async runtime.
acp                  = { default-features = false, package = "agent-client-protocol-schema", version = "1.12" }
anyhow               = "1"
pulldown-cmark       = { default-features = false, features = ["html"], version = "0.13.6" }
# Native chat math: the engine exposes baseline metrics and bounds before rasterization.
ratex-layout         = "=0.1.15"
ratex-parser         = "=0.1.15"
ratex-render         = { features = ["embed-fonts"], version = "=0.1.15" }
ratex-types          = "=0.1.15"
base64               = "0.23.1"
bincode              = { default-features = false, features = ["serde", "std"], version = "2" }
# Reads the Windows clipboard off the UI thread, sized before it is copied.
clipboard-win        = { default-features = false, features = ["std"], version = "5.4.1" }
chrono               = { default-features = false, features = ["clock", "serde"], version = "0.4" }
cocoa                = "0.27"
config_loader        = { default-features = false, features = ["toml"], package = "config", version = "0.15.25" }
core-graphics        = "0.25"
crossbeam-channel    = "0.5"
flate2               = "1"
# Use the same strict macOS family lookup as GPUI, including legacy aliases.
font-kit             = { package = "zed-font-kit", version = "=0.14.1-zed" }
libc                 = "0.2"
# Fluent messages (docs/i18n.md): `spaceport-i18n` loads them through
# i18n-embed's loader and negotiates the locale; `spaceport-gpui`'s build script
# parses them to check `fl!` calls. i18n-embed 0.16 does not build without
# its default `rust-embed` feature, though the app embeds files itself.
fluent               = "0.17"
fluent-langneg       = "0.14"
fluent-syntax        = "0.12"
i18n-embed           = { features = ["fluent-system"], version = "0.16" }
# The user's preferred languages, as the OS lists them.
sys-locale           = "0.3"
unic-langid          = { features = ["macros"], version = "0.9" }
# Locates installed font files on Linux, as GPUI's own text system does.
fontdb               = "0.24"
foreign-types        = "0.5"
futures-channel      = "0.3"
futures-lite         = "2"
gpui                 = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform        = { package = "gpui-pre-platform", version = "=0.3.10" }
spaceport-activation    = { path = "crates/spaceport-activation" }
spaceport-ago           = { path = "crates/spaceport-ago" }
spaceport-backend       = { path = "crates/spaceport-backend" }
spaceport-browser       = { path = "crates/spaceport-browser" }
spaceport-chat-core     = { path = "crates/spaceport-chat-core" }
spaceport-chat-protocol = { path = "crates/spaceport-chat-protocol" }
spaceport-client        = { path = "crates/spaceport-client" }
spaceport-commands      = { path = "crates/spaceport-commands" }
spaceport-control-protocol = { path = "crates/spaceport-control-protocol" }
spaceport-core-client   = { path = "crates/spaceport-core-client" }
spaceport-diagnostics   = { path = "crates/spaceport-diagnostics" }
spaceport-endpoint      = { path = "crates/spaceport-endpoint" }
spaceport-i18n          = { path = "crates/spaceport-i18n" }
spaceport-icons         = { path = "crates/spaceport-icons" }
spaceport-keymap        = { path = "crates/spaceport-keymap" }
spaceport-lenient       = { path = "crates/spaceport-lenient" }
spaceport-live          = { path = "crates/spaceport-live" }
spaceport-motion        = { path = "crates/spaceport-motion" }
spaceport-osc52         = { path = "crates/spaceport-osc52" }
spaceport-palette       = { path = "crates/spaceport-palette" }
spaceport-panes         = { path = "crates/spaceport-panes" }
spaceport-menu          = { path = "crates/spaceport-menu" }
spaceport-protocol      = { path = "crates/spaceport-protocol" }
spaceport-release-notes = { path = "crates/spaceport-release-notes" }
spaceport-remote        = { default-features = false, path = "crates/spaceport-remote" }
spaceport-reorder       = { path = "crates/spaceport-reorder" }
spaceport-settings      = { path = "crates/spaceport-settings" }
spaceport-settings-window = { path = "crates/spaceport-settings-window" }
spaceport-sidebar       = { path = "crates/spaceport-sidebar" }
spaceport-sound         = { path = "crates/spaceport-sound" }
spaceport-state-file    = { path = "crates/spaceport-state-file" }
spaceport-truncate      = { path = "crates/spaceport-truncate" }
spaceport-terminal      = { path = "crates/spaceport-terminal" }
spaceport-textfield     = { path = "crates/spaceport-textfield" }
spaceport-usage         = { path = "crates/spaceport-usage" }
spaceport-web-url       = { path = "crates/spaceport-web-url" }
spaceport-widgets       = { path = "crates/spaceport-widgets" }
spaceport-words         = { path = "crates/spaceport-words" }
interprocess         = "2.4.2"
# Local interface addresses, so Bonjour discovery skips this machine; the
# version mdns-sd already uses.
if-addrs             = "0.15"
# Display and idle holds behind the status bar cup; `bin` would pull in a CLI.
keepawake            = { default-features = false, version = "0.6.1" }
image                = { default-features = false, features = ["gif", "jpeg", "png", "webp"], version = "0.25.10" }
# Mermaid fences in chat answers become diagrams: parse, lay out, and write
# SVG in pure Rust; GPUI rasterizes the SVG. No CLI and no PNG writer.
mermaid-rs-renderer  = { default-features = false, version = "0.3.1" }
# Helix's fzf-style scorer behind the command palette.
nucleo-matcher       = "0.3.1"
# Bonjour browsing for SSH hosts in the Add Device dialog; it runs its own
# thread and needs no async runtime.
mdns-sd              = { default-features = false, version = "0.21.5" }
nix                  = { default-features = false, features = ["socket", "term", "user"], version = "=0.31.3" }
objc                 = "0.2"
# The Secret Service client GPUI's Linux platform links, with its async-io backend.
oo7                  = { default-features = false, features = ["async-std", "native_crypto"], version = "0.6" }
objc2                = "0.6.4"
objc2-app-kit        = { default-features = false, features = ["NSAppearance", "NSApplication", "NSColor", "NSDockTile", "NSDragging", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSTextInputContext", "NSTrackingArea", "NSView", "NSWindow", "block2", "objc2-core-foundation", "std"], version = "0.3.2" }
objc2-foundation     = { default-features = false, features = ["NSArray", "NSBundle", "NSData", "NSError", "NSPathUtilities", "NSProcessInfo", "NSUserDefaults", "NSValue", "NSString", "NSURL", "std"], version = "0.3.2" }
block2               = "0.6.2"
dispatch2            = { default-features = false, features = ["objc2", "std"], version = "0.3.1" }
objc2-core-foundation   = { default-features = false, features = ["CFCGTypes", "std"], version = "0.3.2" }
# Asks for Dock badge permission; the version GPUI's macOS platform already links.
objc2-user-notifications ={ default-features = false, features = ["UNUserNotificationCenter", "block2", "std"], version = "0.3.2" }
raw-window-handle    = "0.6"
# sheprd-acp's in-pane chat view.
ratatui              = { default-features = false, features = ["crossterm"], version = "0.30" }
crossterm            = "0.29"
rodio                = { default-features = false, features = ["playback", "symphonia-mp3", "tracing"], version = "0.22.2" }
rustix               = { features = ["event", "fs", "process", "pty", "termios"], version = "=1.1.6" }
serde                = { features = ["derive"], version = "1" }
serde_json           = "1"
serde_ignored        = "0.1.14"
sha2                 = "0.11.0"
# Reads embedded bitmap strikes to spot fonts GPUI's Linux rasterizer panics on.
skrifa               = { default-features = false, features = ["std"], version = "0.49" }
# Tests hold a port with a socket that is bound but never listens; mdns-sd
# already locks this version.
socket2              = "0.6.5"
# Diff syntax colouring: bundled grammars, parsed with the pure-Rust regex
# engine, no themes (colours come from the app's theme).
syntect              = { default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"], version = "5.3" }
# The version GPUI's screen capture already locks; only CPU and memory are read.
sysinfo              = { default-features = false, features = ["disk", "system"], version = "0.39.6" }
tempfile             = "3"
test-case            = "3"
thiserror            = "2"
toml                 = "1.1"
toml_edit            = "0.25"
tracing              = "0.1"
tracing-subscriber   = { default-features = false, features = ["registry", "std"], version = "0.3" }
unicode-bidi         = "0.3.18"
unicode-properties   = { version = "0.1.4", default-features = false, features = ["emoji"] }
unicode-segmentation = "1"
unicode-width        = "0.2.2"
ureq                 = "3"
uuid                 = { features = ["serde", "v4", "v5"], version = "1" }
# Window shell properties behind the taskbar relaunch identity; the version
# GPUI's Windows platform already links.
windows              = { features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"], version = "0.62.2" }
windows-registry     = "0.100.0"
# The error type `windows-registry` returns; its own version, not `windows`'s.
windows-result       = "0.100.0"
windows-sys          = { features = ["Win32_Foundation", "Win32_System_Pipes"], version = "0.61.2" }
# Embeds the Windows executable's icon and version information; a build
# dependency, so it runs on the host.
winresource          = "0.1.34"
zbus                 = { default-features = false, version = "5.19" }

# Line tables keep file:line in backtraces and crash reports while cutting most
# of the debug info a full build writes and links for spaceport-gpui. Use
# `CARGO_PROFILE_DEV_DEBUG=full` for a debugger session that needs locals.
[profile.dev]
debug = "line-tables-only"

# GPUI's build script embeds its own Windows manifest through embed-resource,
# which would clash with Herdr's (crates/spaceport-gpui/windows.manifest); this
# no-op stands in for it. See crates/embed-resource.
[patch.crates-io]
embed-resource = { path = "crates/embed-resource" }
